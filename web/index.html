<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Finance Platform</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">Local review boundary</p>
      <h1>AI Finance Platform</h1>
      <p>This UI is served by the backend and does not contain provider or database credentials.</p>
      <section>
        <h2>Backend status</h2>
        <p id="health" aria-live="polite">Checking…</p>
        <ul id="modules"></ul>
      </section>
      <section>
        <h2>Sign in</h2>
        <form id="login">
          <label>Email <input name="email" type="email" autocomplete="username" required /></label>
          <label>Password <input name="password" type="password" autocomplete="current-password" required /></label>
          <button type="submit">Sign in</button>
        </form>
        <p id="login-status" aria-live="polite"></p>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
